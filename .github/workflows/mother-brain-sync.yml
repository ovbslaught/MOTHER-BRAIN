name: MOTHER-BRAIN MASTER SYNC — GitHub -> Google Drive Wormhole

on:
  schedule:
    - cron: '0 */6 * * *'
  push:
    branches: [ main, Cosmic-key ]
  workflow_dispatch:

concurrency:
  group: wormhole-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync-mother-brain:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout MOTHER-BRAIN
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Pre-Sync WAL Checkpoint
        run: |
          python -c "
          import sqlite3, glob, os
          for db_path in glob.glob('**/*.db', recursive=True):
              try:
                  conn = sqlite3.connect(db_path)
                  conn.execute('PRAGMA wal_checkpoint(PASSIVE);')
                  conn.close()
                  print(f'Checkpointed: {db_path}')
              except Exception as e:
                  print(f'Notice for {db_path}: {e}')
          "

      - name: Setup rclone
        uses: animus-oss/setup-rclone@v1
        with:
          rclone-config: ${{ secrets.RCLONE_CONFIG }}

      - name: Safe Copy to Google Drive Wormhole Mirror
        run: |
          rclone copy . "gdrive:WORMHOLE/MOTHER-BRAIN" \
            --checksum \
            --fast-list \
            --track-renames \
            --exclude "*.db-wal" \
            --exclude "*.db-shm" \
            --exclude ".git/**" \
            --exclude ".github/**" \
            --exclude "__pycache__/**" \
            --exclude "*.tmp" \
            --exclude "-VAULT-/**" \
            --exclude "-VAULT/**" \
            --verbose
